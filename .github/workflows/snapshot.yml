name: Snapshot

# cron-job.org가 평일 10:05 · 12:05 · 14:05 · 15:35(KST)에 repository_dispatch로 부른다.
#   POST /repos/{owner}/kosdaq-surge/dispatches
#   {"event_type": "snapshot", "client_payload": {"slot": "1005"}}   # 1005 | 1205 | 1405 | close
# 휴장일·시각이 어긋난 호출은 run.py가 알아서 건너뛴다.
on:
  repository_dispatch:
    types: [snapshot]
  workflow_dispatch:
    inputs:
      slot:
        description: "수집 시각 (수동 실행은 시각 검사를 건너뛴다)"
        type: choice
        options: ["close", "1005", "1205", "1405"]
        default: close
      backfill:
        description: "슬롯 대신 5분봉 백필(최근 약 7거래일, 없는 날만)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect
        env:
          SLOT: ${{ github.event.client_payload.slot || inputs.slot }}
          BACKFILL: ${{ inputs.backfill }}
        run: |
          if [ "$BACKFILL" = "true" ]; then
            python backfill.py
          else
            python run.py --slot "$SLOT"
          fi

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A data docs/data
          if git diff --cached --quiet; then
            echo "변경 없음"; exit 0
          fi
          git commit -q -m "data: ${{ github.event.client_payload.slot || inputs.slot }} $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do
            git push && exit 0
            git pull --rebase -q && continue
            sleep $((i * 5))
          done
          exit 1
